<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#090A12" />
    <title>InSync</title>
    <style>
      html, body { margin: 0; background: #09090B; }
      .boot { min-height: 100vh; display: grid; place-items: center; }
      .boot i { width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #fff; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      // Сразу убираем заставку Telegram: SDK грузится в фоне и не должен её задерживать.
      try {
        var proxy = window.TelegramWebviewProxy;
        if (proxy && proxy.postEvent) {
          proxy.postEvent('web_app_ready', '{}');
          proxy.postEvent('web_app_expand', '{}');
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Внешние файлы не блокируют первую отрисовку -->
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <script id="tg-sdk" async src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="app"><div class="boot"><i></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
