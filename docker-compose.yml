# Полный стек InSync: backend (FastAPI + Telegram-бот) и web (nginx + собранный SPA).
#
# Запуск:
#   1) скопируйте backend/.env.example -> backend/.env и заполните BOT_TOKEN,
#      WEBAPP_URL, SESSION_KEYS (и при необходимости MIREA_PROXY);
#   2) docker compose up -d --build
#
# Веб доступен на http://localhost (порт 80). БД SQLite хранится в именованном
# томе insync-data и переживает пересборки.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      - DATABASE_PATH=/app/data/insync.db
    volumes:
      - insync-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  insync-data:
